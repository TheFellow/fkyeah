name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Format check (fantomas)
        run: dotnet fantomas --check src tests

      - name: Restore
        run: dotnet restore Attractor.slnx

      - name: Build
        run: dotnet build Attractor.slnx --no-restore

      - name: Test
        run: dotnet test Attractor.slnx --no-build --verbosity normal
